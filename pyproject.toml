[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megabake"
version = "0.1.0"
description = "PyTorch FX to CuTe CUDA megakernels"
license = {text = "MIT"}
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch>=2.14",
    "nvidia-cutlass-dsl[cu13]==4.8.0",
    "nvidia-cutlass>=4.2.0.0",
    "safetensors>=0.8.0",
    "huggingface-hub>=1.33.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "transformers>=5.18.0",
    "numpy>=2.5.3",
]

[project.scripts]
megabake = "megabake.main:main"

[tool.setuptools.packages.find]
where = ["src"]
